
<!DOCTYPE html>
<html>

<head>
    <title>Student Admission Form</title>
</head>

<body>

    <header>
        <h1><b>Student Admission Form</b></h1>
        <p>Please fill out the form to apply for admission.</p>
    </header>

    <main>

        <form>

            <fieldset>
                <legend><b>Personal Information</b></legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="3" required>
                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX" pattern="03[0-9]{9}" title="Enter an 11-digit Pakistani mobile number starting with 03">
                <br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="16" max="60" required>
                <br><br>

                <label for="city">City:</label>
                <select id="city" name="city" required>
                    <option value="">--Select your city--</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Rawalpindi">Rawalpindi</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Karachi">Karachi</option>
                    <option value="Peshawar">Peshawar</option>
                </select>

            </fieldset>

            <br>

            <fieldset>
                <legend><b>Course Selection</b></legend>

                <label for="course">Choose Your Course:</label>
                <select id="course" name="course" required>
                    <option value="">--Select a course--</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Graphic Design">Graphic Design</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                     <option value="Cyber Security">Cyber Security</option>
                </select>

            </fieldset>

            <br>

            <fieldset>
                <legend><b>Preferred Class Shift</b></legend>

                <input type="radio" id="morning" name="shift" value="Morning" required>
                <label for="morning">Morning</label><br>
                

                <input type="radio" id="evening" name="shift" value="Evening">
                <label for="evening">Evening</label><br>
                

                <input type="radio" id="weekend" name="shift" value="Weekend">
                <label for="weekend">Weekend</label><br>

            </fieldset>

            <br>

            <fieldset>
                <legend><b>Existing Skills</b></legend>

                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html">HTML</label>
                <br>

                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>
                <br>

                <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                <label for="javascript">JavaScript</label>
                <br>

                <input type="checkbox" id="python" name="skills" value="Python">
                <label for="python">Python</label>

            </fieldset>

            <br>

            <fieldset>
                <legend><b>Motivation</b></legend>

                <label for="motivation">Why do you want to join this course?</label><br>
                <textarea id="motivation" name="motivation" placeholder="Write your reason here" minlength="10" maxlength="200" required></textarea>

            </fieldset>

            <br>

            <fieldset>
                <legend><b>Additional Information</b> </legend>

                <label for="portfolio">Portfolio Website URL:</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
                <br><br>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" pattern="03[0-9]{9}" title="Enter an 11-digit Pakistani mobile number starting with 03">
                <br><br>

                <label for="startdate">Preferred Starting Date:</label>
                <input type="date" id="startdate" name="startdate">
                
            </fieldset>

            <br>

            <button type="submit">Submit Application</button>
            <button type="reset">Clear Form</button>

        </form>

    </main>
<hr>
    <footer>
        <p>Student Admission Form - Assignment 03</p>
    </footer>

</body>

</html>
